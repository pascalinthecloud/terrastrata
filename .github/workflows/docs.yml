name: Docs

# Builds the Starlight documentation site in docs/ and publishes it to GitHub
# Pages. Pull requests build it without deploying, so a broken site is caught in
# review rather than after a merge to main.
#
# Actions are pinned to full commit SHAs (the tag comment is informative only);
# dependabot bumps the SHAs.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One deployment at a time, and never cancel one midway: an interrupted
# deploy-pages leaves the site on the previous version, which is fine, but a
# cancelled *upload* wastes the whole build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # `npm ci` rather than `install`: the lockfile is the build input, and a
      # silently updated dependency tree is not something a docs build should do.
      - run: npm ci
      - run: npm run build
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy
    # Only main deploys; a pull request stops after the build above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC token the Pages deployment is verified with
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

# All actions are pinned to full commit SHAs (the tag comment is informative
# only): tags are mutable and this repo's supply-chain posture (SECURITY.md)
# assumes immutable references. Dependabot bumps the SHAs.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Install golangci-lint from source so it is built with the same Go
      # toolchain as the module. Prebuilt release binaries are built with an
      # older Go and refuse to lint a newer `go` directive in go.mod.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      # govulncheck and osv-scanner answer different questions and both are
      # cheap. govulncheck is call-graph aware: it only reports a vulnerability
      # our code can actually reach, which keeps it quiet enough to gate on.
      # osv-scanner reports any dependency *version* in go.mod with a known
      # advisory, reachable or not — the view an auditor or a downstream
      # consumer of the SBOM takes, and the one that catches a vulnerable module
      # sitting in the graph waiting for a future call site.
      - name: osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          osv-scanner scan source --recursive .

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # "app" mode records what actually ends up in the binary rather than every
      # module in the graph, so the BOM describes the artifact we ship instead of
      # the checkout it was built from. Build constraints steer Go's module
      # selection, so they have to match the Dockerfile's build.
      - name: Generate CycloneDX SBOM
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod app -licenses -json -main ./cmd/terrastrata -output sbom.cdx.json .
      - name: Summarise the SBOM
        run: |
          count=$(jq '.components | length' sbom.cdx.json)
          test "$count" -gt 0 || { echo "SBOM lists no components" >&2; exit 1; }
          {
            echo "### SBOM — $count components (CycloneDX $(jq -r .specVersion sbom.cdx.json))"
            echo
            jq -r '.components[] | "- `\(.name)` \(.version)"' sbom.cdx.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  deps:
    name: Dependency review
    # Compares the PR's dependency manifests against the base branch and fails
    # on a newly introduced advisory. This is the gate Dependabot cannot be:
    # Dependabot reacts after a fixed version exists, while this refuses the
    # dependency at the point someone adds it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Strong copyleft would be a licensing problem for an Apache-2.0
          # project. Better to hear about it in review than at adoption.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: never

  charts:
    name: Helm chart + manifests
    runs-on: ubuntu-latest
    env:
      # The CRDs-catalog schema location lets kubeconform validate CRD-backed
      # resources (ServiceMonitor) alongside the builtin schemas.
      KUBECONFORM: >-
        go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
        -strict -summary
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: helm lint
        run: helm lint deploy/helm/terrastrata
      - name: Validate default render
        run: |
          helm template t deploy/helm/terrastrata \
            | eval $KUBECONFORM
      - name: Validate HA render (S3-backed, PDB, ingress, ServiceMonitor)
        run: |
          helm template t deploy/helm/terrastrata \
            --set replicaCount=3 \
            --set persistence.enabled=false \
            --set s3.enabled=true --set s3.bucket=b \
            --set podDisruptionBudget.enabled=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.labels.release=monitoring \
            | eval $KUBECONFORM
      - name: Multi-replica RWO guard must fail
        run: |
          if helm template t deploy/helm/terrastrata --set replicaCount=2 >/dev/null 2>&1; then
            echo "expected render failure for replicaCount>1 with a RWO PVC" >&2
            exit 1
          fi
      - name: Validate raw manifests
        run: eval $KUBECONFORM deploy/k8s/manifests.yaml

  e2e:
    name: E2E (terraform init)
    runs-on: ubuntu-latest
    # A throwaway token for the auth half of this job. It guards a container that
    # lives for the length of one CI run and is reachable only on localhost.
    env:
      E2E_AUTH_TOKEN: e2e-token-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: terrastrata:e2e
      # Terraform refuses a plaintext network_mirror URL, so the mirror sits
      # behind an nginx TLS proxy with a self-signed cert — the same shape as
      # production (TLS terminated in front of terrastrata). SSL_CERT_FILE
      # makes terraform and curl trust it without touching the system store.
      - name: Run terrastrata behind a TLS proxy
        run: |
          # Terraform rejects a module registry hostname without a dot, so the
          # module half of this job addresses the same server as mirror.test.
          echo "127.0.0.1 mirror.test mirror-auth.test" | sudo tee -a /etc/hosts >/dev/null
          docker run -d --name terrastrata --network host \
            -e MODULES_ENABLED=true \
            -e UPSTREAM_BASE="https://registry.terraform.io,https://registry.opentofu.org" \
            terrastrata:e2e
          # A second instance with auth on, for the module-archive signature
          # path: the archive endpoint cannot take a bearer header (Terraform
          # sends none on the X-Terraform-Get fetch), so it is authorized by the
          # signature the download endpoint mints. Only a real client proves that
          # chain holds. Auth stays off on the first instance because Terraform's
          # network_mirror client sends no credentials at all.
          docker run -d --name terrastrata-auth --network host \
            -e LISTEN_ADDR=:8081 \
            -e MODULES_ENABLED=true \
            -e AUTH_TOKEN="$E2E_AUTH_TOKEN" \
            terrastrata:e2e
          mkdir tls && cd tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem \
            -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:mirror.test,DNS:mirror-auth.test,IP:127.0.0.1"
          cat > nginx.conf <<'EOF'
          events {}
          http {
            server {
              listen 8443 ssl;
              ssl_certificate /tls/cert.pem;
              ssl_certificate_key /tls/key.pem;
              location / {
                proxy_pass http://127.0.0.1:8080;
              }
            }
            server {
              listen 8444 ssl;
              ssl_certificate /tls/cert.pem;
              ssl_certificate_key /tls/key.pem;
              location / {
                proxy_pass http://127.0.0.1:8081;
              }
            }
          }
          EOF
          docker run -d --name tls-proxy --network host \
            -v "$PWD:/tls:ro" -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          for i in $(seq 1 30); do
            if curl -fs --cacert cert.pem https://localhost:8443/health >/dev/null \
               && curl -fs --cacert cert.pem https://localhost:8444/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "mirror did not become healthy" >&2
          docker logs terrastrata >&2
          docker logs terrastrata-auth >&2
          docker logs tls-proxy >&2
          exit 1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # The real client is the one thing unit tests cannot fake: run terraform
      # init through the mirror twice and require the second install to be
      # served entirely from cache.
      - name: terraform init through the mirror
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tls/cert.pem
        run: |
          export TF_CLI_CONFIG_FILE=$PWD/e2e.tfrc
          cat > e2e.tfrc <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://localhost:8443/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF
          mkdir cold warm
          cat > cold/main.tf <<'EOF'
          terraform {
            required_providers {
              null = {
                source  = "registry.terraform.io/hashicorp/null"
                version = "3.2.2"
              }
            }
          }
          EOF
          cp cold/main.tf warm/main.tf
          terraform -chdir=cold init -input=false -no-color
          terraform -chdir=warm init -input=false -no-color
      # The same mirror, the same protocol, a different client. The README claims
      # OpenTofu support; this is what stops that claim from rotting silently.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - name: tofu init through the mirror
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tls/cert.pem
        run: |
          export TF_CLI_CONFIG_FILE=$PWD/tofu.tfrc
          cat > tofu.tfrc <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://localhost:8443/"
              include = ["registry.opentofu.org/*/*"]
            }
            direct {
              exclude = ["registry.opentofu.org/*/*"]
            }
          }
          EOF
          mkdir tofu-cold tofu-warm
          cat > tofu-cold/main.tf <<'EOF'
          terraform {
            required_providers {
              null = {
                source  = "registry.opentofu.org/hashicorp/null"
                version = "3.2.2"
              }
            }
          }
          EOF
          cp tofu-cold/main.tf tofu-warm/main.tf
          tofu -chdir=tofu-cold init -input=false -no-color
          tofu -chdir=tofu-warm init -input=false -no-color
      - name: Assert the OpenTofu provider is cached under its own hostname
        run: |
          base=https://localhost:8443/registry.opentofu.org/hashicorp/null
          for path in \
            "$base/index.json" \
            "$base/3.2.2.json" \
            "$base/3.2.2/download/linux_amd64/terraform-provider-null_3.2.2_linux_amd64.zip"; do
            cache=$(curl -fs --cacert tls/cert.pem -o /dev/null -w '%header{x-cache}' "$path")
            echo "$path -> X-Cache: $cache"
            if [ "$cache" != "HIT" ]; then
              echo "expected a cache HIT" >&2
              exit 1
            fi
          done
          # The two registries ship different bytes for the same coordinate, so a
          # shared cache key would serve the wrong provider. Prove they differ.
          zip=/hashicorp/null/3.2.2/download/linux_amd64/terraform-provider-null_3.2.2_linux_amd64.zip
          tf=$(curl -fs --cacert tls/cert.pem "https://localhost:8443/registry.terraform.io$zip" | sha256sum | cut -d' ' -f1)
          tofu=$(curl -fs --cacert tls/cert.pem "https://localhost:8443/registry.opentofu.org$zip" | sha256sum | cut -d' ' -f1)
          echo "terraform=$tf"
          echo "opentofu =$tofu"
          if [ "$tf" = "$tofu" ]; then
            echo "both hostnames served identical bytes: the cache is aliasing across upstreams" >&2
            exit 1
          fi
      - name: Assert everything the client needed is now cached
        run: |
          base=https://localhost:8443/registry.terraform.io/hashicorp/null
          for path in \
            "$base/index.json" \
            "$base/3.2.2.json" \
            "$base/3.2.2/download/linux_amd64/terraform-provider-null_3.2.2_linux_amd64.zip"; do
            cache=$(curl -fs --cacert tls/cert.pem -o /dev/null -w '%header{x-cache}' "$path")
            echo "$path -> X-Cache: $cache"
            if [ "$cache" != "HIT" ]; then
              echo "expected a cache HIT" >&2
              exit 1
            fi
          done
      # The module half. Unlike providers there is no mirror protocol, so
      # terrastrata is addressed as the registry itself and Terraform finds it
      # through /.well-known/terraform.json. This is the only test that proves
      # the X-Terraform-Get rewrite and the codeload repacking against the real
      # client: Terraform does not expand the go-getter "//*" subdir glob for
      # registry modules, so a wrongly-shaped archive fails only here.
      #
      # claranet/regions is chosen because it is ~27 KB and declares no
      # providers, so this step downloads nothing heavy. A cold fetch reaches
      # codeload.github.com unauthenticated.
      - name: terraform init a module through the registry
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tls/cert.pem
        run: |
          mkdir mod-cold mod-warm
          cat > mod-cold/main.tf <<'EOF'
          module "regions" {
            source  = "mirror.test:8443/claranet/regions/azurerm"
            version = "8.0.6"
          }
          EOF
          cp mod-cold/main.tf mod-warm/main.tf
          terraform -chdir=mod-cold init -input=false -no-color
          terraform -chdir=mod-warm init -input=false -no-color

          # The module must land at its own root, not inside the tarball's
          # wrapper directory and not at a literal "*" path.
          dir=$(python3 -c "import json;print(json.load(open('mod-cold/.terraform/modules/modules.json'))['Modules'][1]['Dir'])")
          echo "module installed at: $dir"
          case "$dir" in
            *'*'*) echo "subdir glob was not expanded" >&2; exit 1 ;;
          esac
          test -f "mod-cold/$dir/README.md" || {
            echo "module root does not look right:" >&2
            ls -la "mod-cold/$dir" >&2
            exit 1
          }
      - name: Assert the module is now cached
        run: |
          base=https://mirror.test:8443/v1/modules/claranet/regions/azurerm
          for path in "$base/versions" "$base/8.0.6/download" "$base/8.0.6/archive?archive=tar.gz"; do
            cache=$(curl -fs --cacert tls/cert.pem -o /dev/null -w '%header{x-cache}' "$path")
            echo "$path -> X-Cache: $cache"
            if [ "$cache" != "HIT" ]; then
              echo "expected a cache HIT" >&2
              exit 1
            fi
          done
          # Every module resolution must be served from our own archive, not
          # passed through to the upstream source.
          curl -fs http://127.0.0.1:8080/metrics \
            | grep 'terrastrata_module_downloads_total{outcome="bypass"}' \
            && { echo "a module download bypassed the cache" >&2; exit 1; }
          exit 0
      # The authenticated module path, end to end. Terraform sends the token
      # from its credentials block to the registry endpoints but never to the
      # X-Terraform-Get fetch that follows, so this init only succeeds if the
      # signed archive URL is accepted without a header — the exact chain that
      # unit tests can only approximate.
      - name: terraform init a module through the authenticated registry
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tls/cert.pem
        run: |
          export TF_CLI_CONFIG_FILE=$PWD/auth.tfrc
          cat > auth.tfrc <<EOF
          credentials "mirror-auth.test:8444" {
            token = "$E2E_AUTH_TOKEN"
          }
          EOF
          mkdir mod-auth
          cat > mod-auth/main.tf <<'EOF'
          module "regions" {
            source  = "mirror-auth.test:8444/claranet/regions/azurerm"
            version = "8.0.6"
          }
          EOF
          terraform -chdir=mod-auth init -input=false -no-color
      - name: Assert the archive endpoint only serves signed URLs
        run: |
          base=https://mirror-auth.test:8444/v1/modules/claranet/regions/azurerm
          code() { curl -s --cacert tls/cert.pem -o /dev/null -w '%{http_code}' "$@"; }

          # Registry endpoints stay behind the bearer header.
          test "$(code "$base/versions")" = 401 || {
            echo "versions endpoint answered without a token" >&2; exit 1; }

          # The archive is cached by now (the init above warmed it), so an
          # unsigned request is exactly the case that would otherwise hand module
          # source to an unauthenticated caller.
          test "$(code "$base/8.0.6/archive?archive=tar.gz")" = 403 || {
            echo "unsigned archive request was not rejected" >&2; exit 1; }

          # Mint a URL the way Terraform does, and check it works — then that
          # tampering with the signature does not.
          get=$(curl -fs --cacert tls/cert.pem -D - -o /dev/null \
                  -H "Authorization: Bearer $E2E_AUTH_TOKEN" \
                  "$base/8.0.6/download" \
                | tr -d '\r' | awk 'tolower($1) == "x-terraform-get:" {print $2}')
          echo "X-Terraform-Get: $get"
          case "$get" in
            *sig=*exp=*|*exp=*sig=*) ;;
            *) echo "archive URL carries no signature" >&2; exit 1 ;;
          esac
          # Strip the "//*" subdir the way go-getter does before fetching.
          signed="https://mirror-auth.test:8444$(echo "$get" | sed 's|//\*||')"
          test "$(code "$signed")" = 200 || {
            echo "signed archive request was rejected: $signed" >&2; exit 1; }
          test "$(code "${signed}0")" = 403 || {
            echo "tampered signature was accepted" >&2; exit 1; }
      - name: Container logs
        if: failure()
        run: |
          docker logs terrastrata || true
          docker logs terrastrata-auth || true
          docker logs tls-proxy || true

  docker:
    name: Image build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: terrastrata:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terrastrata:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

name: Scheduled image scan

# Re-scans the latest published GHCR image weekly so CVEs disclosed after a
# release surface without waiting for the next commit. CI already scans every
# image at build time; this catches what is found later.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan of published image
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

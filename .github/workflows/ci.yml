name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

# All actions are pinned to full commit SHAs (the tag comment is informative
# only): tags are mutable and this repo's supply-chain posture (SECURITY.md)
# assumes immutable references. Dependabot bumps the SHAs.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Install golangci-lint from source so it is built with the same Go
      # toolchain as the module. Prebuilt release binaries are built with an
      # older Go and refuse to lint a newer `go` directive in go.mod.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  charts:
    name: Helm chart + manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: helm lint
        run: helm lint deploy/helm/terrastrata
      - name: Validate default render
        run: |
          helm template t deploy/helm/terrastrata \
            | $KUBECONFORM -strict -summary
      - name: Validate HA render (S3-backed, PDB, ingress)
        run: |
          helm template t deploy/helm/terrastrata \
            --set replicaCount=3 \
            --set persistence.enabled=false \
            --set s3.enabled=true --set s3.bucket=b \
            --set podDisruptionBudget.enabled=true \
            --set ingress.enabled=true \
            | $KUBECONFORM -strict -summary
      - name: Multi-replica RWO guard must fail
        run: |
          if helm template t deploy/helm/terrastrata --set replicaCount=2 >/dev/null 2>&1; then
            echo "expected render failure for replicaCount>1 with a RWO PVC" >&2
            exit 1
          fi
      - name: Validate raw manifests
        run: $KUBECONFORM -strict -summary deploy/k8s/manifests.yaml

  docker:
    name: Image build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: terrastrata:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terrastrata:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

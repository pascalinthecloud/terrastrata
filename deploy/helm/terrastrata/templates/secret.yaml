{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terrastrata.fullname" . }}-auth
  labels:
    {{- include "terrastrata.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_TOKEN: {{ required "auth.token is required when auth.enabled and no existingSecret is set" .Values.auth.token | quote }}
{{- end }}
{{- /* Static S3 credentials are optional: with neither inline keys nor an
existingSecret, terrastrata uses the AWS default credential chain (IRSA,
instance profile). */}}
{{- if and .Values.s3.enabled (not .Values.s3.existingSecret) (or .Values.s3.accessKey .Values.s3.secretKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terrastrata.fullname" . }}-s3
  labels:
    {{- include "terrastrata.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ required "s3.accessKey and s3.secretKey must be set together" .Values.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ required "s3.accessKey and s3.secretKey must be set together" .Values.s3.secretKey | quote }}
{{- end }}

# Default values for terrastrata.

image:
  repository: ghcr.io/pascalinthecloud/terrastrata
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Number of replicas. Keep at 1 with a ReadWriteOnce PVC (the default). For
# high availability, run multiple replicas in S3-backed mode — see the HA recipe:
#
#   replicaCount: 3
#   persistence.enabled: false   # local cache becomes a per-pod emptyDir
#   s3.enabled: true             # shared durable layer all replicas read/write
#   podDisruptionBudget.enabled: true
#
# Each replica keeps its own fast local cache and shares durability via S3; a
# cold object may be fetched up to once per replica (in-process coalescing is
# per-pod), still far below per-request. A ReadWriteOnce PVC cannot be shared, so
# replicaCount > 1 with persistence.enabled=true is rejected at render time
# unless the PVC is ReadWriteMany.
replicaCount: 1

# Core configuration (maps to terrastrata env vars).
config:
  listenAddr: ":8080"
  upstreamBase: "https://registry.terraform.io"
  # Mirror several registries from one deployment and one cache. When set, this
  # replaces upstreamBase. Each entry needs a url; give it a hostname only when
  # the {hostname} clients address differs from the upstream URL's host.
  #
  #   upstreams:
  #     - url: https://registry.terraform.io
  #     - url: https://registry.opentofu.org
  #     - hostname: registry.corp.example
  #       url: https://nexus.corp/repo/tf
  upstreams: []
  logLevel: "info"
  # Versions-index freshness window (Go duration); "0" disables expiry.
  indexTTL: "10m"
  # Local cache size budget; LRU eviction keeps the cache under it. Keep it a
  # few GB below persistence.size so the volume never fills (the default tracks
  # the 20Gi default PVC). Empty/"0" disables eviction (unbounded growth).
  cacheMaxBytes: "18GB"

# Optional Terraform module registry (off by default).
#
# Unlike the provider mirror this is a *registry*, not a mirror: Terraform has no
# module mirror protocol, so consumers must point each module's source at this
# host (source = "tf-mirror.internal/<namespace>/<name>/<system>") and reach it
# over https under a hostname containing a dot. Enabling it adds the
# /.well-known/terraform.json and /v1/modules/ routes.
#
# Note that module archives are cached unverified: the protocol publishes no
# checksums, unlike provider zips.
modules:
  enabled: false
  # Upstream module registry. Empty means use config.upstreamBase.
  upstreamBase: ""

# Optional startup cache pre-warming.
#   providers: list of "[host/]namespace/type[@version]"
#   platforms: os_arch list to warm zips for (@version entries only)
prewarm:
  providers: []
  platforms:
    - linux_amd64

# Optional bearer-token auth on mirror endpoints.
# When auth.existingSecret is set, the token is read from it (key: AUTH_TOKEN);
# otherwise auth.token is used to create a Secret. Empty = auth disabled.
auth:
  enabled: false
  token: ""
  existingSecret: ""

# Optional durable S3-compatible cache layer.
s3:
  enabled: false
  bucket: ""
  prefix: "tf-mirror"
  endpoint: "" # e.g. https://s3.de.io.cloud.ovh.net (leave blank for AWS)
  region: "us-east-1"
  # Credentials, in order of preference:
  #   1. existingSecret with keys S3_ACCESS_KEY / S3_SECRET_KEY (recommended for
  #      production — keeps secrets out of values files and release history)
  #   2. accessKey/secretKey inline (chart creates a Secret)
  #   3. all empty: the AWS default credential chain (IRSA, instance profile).
  #      For IRSA, annotate the service account via serviceAccount.annotations.
  accessKey: ""
  secretKey: ""
  existingSecret: ""

# Local filesystem fast cache. When enabled, a PVC is mounted at /cache. Disable
# it (enabled: false) to use a per-pod emptyDir instead — required for
# multi-replica HA, where the durable S3 layer is shared and the local layer is
# just an ephemeral per-pod accelerator.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi

# Optional PodDisruptionBudget — keeps a minimum number of replicas available
# during voluntary disruptions (node drains, rolling updates). Only meaningful
# with replicaCount > 1; enable it for HA.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1   # set one of minAvailable / maxUnavailable, not both

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tf-mirror.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod- and container-level hardening. Defaults match the distroless nonroot image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/terrastrata
  annotations: {}

# Prometheus-operator style scraping. Enable this when your stack discovers
# targets via ServiceMonitor CRDs — kube-prometheus-stack, or the
# VictoriaMetrics operator (which converts ServiceMonitors automatically).
# Requires the monitoring.coreos.com/v1 ServiceMonitor CRD to be installed.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: ""
  # Extra labels for the ServiceMonitor, e.g. when your Prometheus selects
  # ServiceMonitors by label:
  #   release: kube-prometheus-stack
  labels: {}

# The prometheus.io/* annotations below only work with classic annotation-based
# Prometheus scrape configs; operator-based stacks ignore them (use
# serviceMonitor.enabled instead).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

nodeSelector: {}
tolerations: []

# Pod affinity/anti-affinity. Left empty by default; when replicaCount > 1 and
# this is empty, the chart injects a soft (preferred) anti-affinity so replicas
# prefer to spread across nodes. Set this to take full control.
affinity: {}

# Optional topologySpreadConstraints (rendered verbatim when set). Use for hard
# spreading across zones/nodes in HA, e.g.:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: terrastrata
topologySpreadConstraints: []

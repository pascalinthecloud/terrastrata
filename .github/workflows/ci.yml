name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

# All actions are pinned to full commit SHAs (the tag comment is informative
# only): tags are mutable and this repo's supply-chain posture (SECURITY.md)
# assumes immutable references. Dependabot bumps the SHAs.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Install golangci-lint from source so it is built with the same Go
      # toolchain as the module. Prebuilt release binaries are built with an
      # older Go and refuse to lint a newer `go` directive in go.mod.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  charts:
    name: Helm chart + manifests
    runs-on: ubuntu-latest
    env:
      # The CRDs-catalog schema location lets kubeconform validate CRD-backed
      # resources (ServiceMonitor) alongside the builtin schemas.
      KUBECONFORM: >-
        go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
        -strict -summary
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: helm lint
        run: helm lint deploy/helm/terrastrata
      - name: Validate default render
        run: |
          helm template t deploy/helm/terrastrata \
            | eval $KUBECONFORM
      - name: Validate HA render (S3-backed, PDB, ingress, ServiceMonitor)
        run: |
          helm template t deploy/helm/terrastrata \
            --set replicaCount=3 \
            --set persistence.enabled=false \
            --set s3.enabled=true --set s3.bucket=b \
            --set podDisruptionBudget.enabled=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.labels.release=monitoring \
            | eval $KUBECONFORM
      - name: Multi-replica RWO guard must fail
        run: |
          if helm template t deploy/helm/terrastrata --set replicaCount=2 >/dev/null 2>&1; then
            echo "expected render failure for replicaCount>1 with a RWO PVC" >&2
            exit 1
          fi
      - name: Validate raw manifests
        run: eval $KUBECONFORM deploy/k8s/manifests.yaml

  e2e:
    name: E2E (terraform init)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: terrastrata:e2e
      # Terraform refuses a plaintext network_mirror URL, so the mirror sits
      # behind an nginx TLS proxy with a self-signed cert — the same shape as
      # production (TLS terminated in front of terrastrata). SSL_CERT_FILE
      # makes terraform and curl trust it without touching the system store.
      - name: Run terrastrata behind a TLS proxy
        run: |
          docker run -d --name terrastrata --network host terrastrata:e2e
          mkdir tls && cd tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem \
            -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          cat > nginx.conf <<'EOF'
          events {}
          http {
            server {
              listen 8443 ssl;
              ssl_certificate /tls/cert.pem;
              ssl_certificate_key /tls/key.pem;
              location / {
                proxy_pass http://127.0.0.1:8080;
              }
            }
          }
          EOF
          docker run -d --name tls-proxy --network host \
            -v "$PWD:/tls:ro" -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          for i in $(seq 1 30); do
            curl -fs --cacert cert.pem https://localhost:8443/health >/dev/null && exit 0
            sleep 1
          done
          echo "mirror did not become healthy" >&2
          docker logs terrastrata >&2
          docker logs tls-proxy >&2
          exit 1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # The real client is the one thing unit tests cannot fake: run terraform
      # init through the mirror twice and require the second install to be
      # served entirely from cache.
      - name: terraform init through the mirror
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tls/cert.pem
        run: |
          export TF_CLI_CONFIG_FILE=$PWD/e2e.tfrc
          cat > e2e.tfrc <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://localhost:8443/"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF
          mkdir cold warm
          cat > cold/main.tf <<'EOF'
          terraform {
            required_providers {
              null = {
                source  = "registry.terraform.io/hashicorp/null"
                version = "3.2.2"
              }
            }
          }
          EOF
          cp cold/main.tf warm/main.tf
          terraform -chdir=cold init -input=false -no-color
          terraform -chdir=warm init -input=false -no-color
      - name: Assert everything the client needed is now cached
        run: |
          base=https://localhost:8443/registry.terraform.io/hashicorp/null
          for path in \
            "$base/index.json" \
            "$base/3.2.2.json" \
            "$base/3.2.2/download/linux_amd64/terraform-provider-null_3.2.2_linux_amd64.zip"; do
            cache=$(curl -fs --cacert tls/cert.pem -o /dev/null -w '%header{x-cache}' "$path")
            echo "$path -> X-Cache: $cache"
            if [ "$cache" != "HIT" ]; then
              echo "expected a cache HIT" >&2
              exit 1
            fi
          done
      - name: Container logs
        if: failure()
        run: |
          docker logs terrastrata || true
          docker logs tls-proxy || true

  docker:
    name: Image build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: terrastrata:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terrastrata:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

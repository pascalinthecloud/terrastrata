apiVersion: v2
name: terrastrata
description: Pull-through Terraform and OpenTofu provider cache registry (network mirror protocol)
type: application
# Chart version; bump on chart changes.
version: 0.5.1
# Application version; tracks the terrastrata release.
appVersion: "0.5.1"
home: https://github.com/pascalinthecloud/terrastrata
sources:
  - https://github.com/pascalinthecloud/terrastrata
keywords:
  - terraform
  - opentofu
  - provider-mirror
  - module-registry
  - cache
  - proxy
  - registry
maintainers:
  - name: Pascal Toepke
# Artifact Hub metadata. Without these the chart is published to GHCR but shows
# up bare on artifacthub.io, where people actually look for charts.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/pascalinthecloud/terrastrata
    - name: documentation
      url: https://github.com/pascalinthecloud/terrastrata#readme
    - name: changelog
      url: https://github.com/pascalinthecloud/terrastrata/blob/main/CHANGELOG.md
    - name: security policy
      url: https://github.com/pascalinthecloud/terrastrata/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: terrastrata
      image: ghcr.io/pascalinthecloud/terrastrata:0.5.1
      whitelisted: false
  artifacthub.io/maintainers: |
    - name: Pascal Toepke
      email: pascal.toepke@gmail.com

name: Release

# Publishes a multi-arch container image to GHCR on every version tag, with an
# SBOM, build provenance, and a keyless cosign signature, and attaches the bills
# of material to the GitHub Release as downloadable files. Tag a release with:
#   git tag v0.2.0 && git push origin v0.2.0
#
# All actions are pinned to full commit SHAs (the tag comment is informative
# only) — this workflow holds packages:write and id-token:write and signs the
# artifacts, so mutable tag references are not acceptable. Dependabot bumps
# the SHAs.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR
  id-token: write # cosign keyless signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build, push, sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Reproducible build date (commit time)
        id: date
        run: echo "value=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Two bills of material ship with every release:
      #
      #   * the SPDX SBOM buildkit already produced per platform, describing what
      #     is actually inside the pushed image (Go modules plus the distroless
      #     base). It lives in the registry as an attestation either way — this
      #     only makes it downloadable without a registry client.
      #   * a CycloneDX BOM of the binary's own dependency graph, for tooling
      #     that wants a source-level view. Build constraints match the
      #     Dockerfile so module selection is the same.
      - name: Assemble the release SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          ref="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          for platform in linux/amd64 linux/arm64; do
            out="sbom/terrastrata-$(echo "$platform" | tr '/' '-').spdx.json"
            docker buildx imagetools inspect "$ref" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "$out"
            # A format change upstream would otherwise ship a hollow BOM quietly.
            test "$(jq '.packages | length' "$out")" -gt 0 || {
              echo "no SPDX packages extracted for $platform" >&2; exit 1; }
          done
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            app -licenses -json -main ./cmd/terrastrata -output sbom/terrastrata.cdx.json .
          test "$(jq '.components | length' sbom/terrastrata.cdx.json)" -gt 0 || {
            echo "CycloneDX BOM lists no components" >&2; exit 1; }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            sbom/terrastrata.cdx.json
            sbom/terrastrata-linux-amd64.spdx.json
            sbom/terrastrata-linux-arm64.spdx.json
